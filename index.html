<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Encontre séries compatíveis com seus gêneros favoritos no CineMatch.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch</title>
    <!-- Open Graph -->
    <meta property="og:title" content="CineMatch - Recomendações de Séries">
    <meta property="og:description" content="Descubra séries de acordo com seus gêneros favoritos.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>CineMatch</h1>
        <p>Descubra séries que combinam com você!</p>
    </header>

    <main>
        <!-- Formulario -->
        <section id="perfil-section" class="section">
            <h2>Monte seu perfil</h2>
            <form id="form-profile">
                <div class="field">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" placeholder="Ex: Rodrigo Silva" required>
                </div>
                <div class="field">
                    <label for="age">Idade</label>
                    <input type="number" id="age" name="age" placeholder="Ex: 25" required>
                </div>
                <fieldset>
                    <legend>Gêneros favoritos</legend>
                    <label><input type="checkbox" name="genres" value="Drama">Drama</label>
                    <label><input type="checkbox" name="genres" value="Comedy">Comédia</label>
                    <label><input type="checkbox" name="genres" value="Action">Ação</label>
                    <label><input type="checkbox" name="genres" value="fiction">Ficção</label>
                    <label><input type="checkbox" name="genres" value="Horror">Terror</label>
                    <label><input type="checkbox" name="genres" value="Thriller">Suspense</label>
                    <label><input type="checkbox" name="genres" value="Romance">Romance</label>
                </fieldset>
                <p id="form-message" class="message"></p>
                <button type="submit">Ver recomendações</button>
            </form>
        </section>
        <!-- Resultados -->
        <section id="results-section" class="results-section-style" hidden>
            <div class="top-results">
                <h2>Suas recomendações</h2>
                <p id="welcome-message"></p>
            </div>

            <button id="btn-switch-profile" type="button">Trocar perfil</button>
            <div>
                <p id="loading-message" class="message"></p>
                <p id="error-message" class="error-message"></p>
                <p id="calculation-accountant"></p>
                <div id="results" class="results-grid"></div>
            </div>
            <!-- Os resultados aparecerao aqui -->
        </section>
    </main>

    <footer class="baseboard">
        <p>&copf; 2026 CineMatch feito por Rodrigo Elias</p>
    </footer>

    <script type="module" src="js/script.js"></script>
</body>
</html>
