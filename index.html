<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch</title>
</head>
<body>
    <header>
        <h1>CineMatch</h1>
    </header>

    <main>
        <section id="perfil-section">
            //Fomulário de Perfil para prencher
            <form id="form-perfil">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required>

                <label for="idade">Idade</label>
                <input type="number" id="idade" required>

                <fieldset>
                    <legend>Generos favoritos</legend>
                    <label><input type="checkbox" name="genero" value="Drama">Drama</label>
                    <label><input type="checkbox" name="genero" value="Comédia">Comédia</label>
                    <label><input type="checkbox" name="genero" value="Ação">Ação</label>
                    <label><input type="checkbox" name="genero" value="Ficção">Ficção</label>
                </fieldset>

                <button type="submit">Ver recomendações</button>
            </form>
        </section>
        <section id="catalogo-section" hidden>
            //Resultados vai aparece aqui
        </section>
    </main>

    <footer>
        <p>&copf; 2026 CineMatch feito por Rodrigo Elias</p>
    </footer>
</body>
</html>
