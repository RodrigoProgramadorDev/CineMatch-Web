<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="CineMatch - Recomendações de séries personalizadas">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>CineMatch</h1>
    </header>

    <main>
        <section id="perfil-section" class="perfil-section">
            <!-- Fomulário de Perfil para prencher -->
            <form id="form-perfil" class="form-perfil">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Ex: Rodrigo Silva" required>

                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Ex: 25" required>

                <fieldset>
                    <legend>Generos favoritos</legend>
                    <label><input type="checkbox" name="genero" value="Drama">Drama</label>
                    <label><input type="checkbox" name="genero" value="Comédia">Comédia</label>
                    <label><input type="checkbox" name="genero" value="Ação">Ação</label>
                    <label><input type="checkbox" name="genero" value="Ficção">Ficção</label>
                </fieldset>

                <button type="submit">Ver recomendações</button>
            </form>
        </section>
        <section id="resultados" class="cards-container">
            <!-- Resultados vai aparece aqui -->
        </section>
    </main>

    <footer>
        <p>&copf; 2026 CineMatch feito por Rodrigo Elias</p>
    </footer>
</body>
</html>
